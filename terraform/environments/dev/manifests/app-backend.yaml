# Application backend Deployment (006-app-backend) — sdd-apps namespace.
# Split (015-10): the backend Service moved to app-backend-service.yaml (always
# applied); this Deployment applies ONLY when backend_image_tag is set
# (count-gated null_resource) — empty tag = keep current in-cluster image.
# Image is substituted by Terraform (012): ECR image + ecr-pull-secret.
# Each %%...%% placeholder appears exactly once (014 gotcha: replace() hits all occurrences).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: sdd-apps
  labels:
    app: app-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-backend
  template:
    metadata:
      labels:
        app: app-backend
    spec:
      containers:
        - name: app-backend
          image: %%BACKEND_IMAGE%%
          ports:
            - containerPort: %%BACKEND_PORT%%
              name: http
          env:
            - name: DB_HOST
              value: mysql.sdd-apps.svc.cluster.local
            - name: DB_PORT
              value: "3306"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD
            - name: DB_NAME
              value: sdd_backend
          readinessProbe:
            httpGet:
              path: %%BACKEND_READINESS_PATH%%
              port: %%BACKEND_PORT%%
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: %%BACKEND_LIVENESS_PATH%%
              port: %%BACKEND_PORT%%
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
%%BACKEND_PULL_SECRET%%
