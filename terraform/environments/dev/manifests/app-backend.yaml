# Application backend scaffold (006-app-backend) — sdd-apps namespace.
# Public image (nginx:alpine) pulled via NAT egress — no imagePullSecrets.
# No secrets in this manifest (no %%TOKEN%% placeholders).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: sdd-apps
  labels:
    app: app-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-backend
  template:
    metadata:
      labels:
        app: app-backend
    spec:
      containers:
        - name: app-backend
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-backend
  namespace: sdd-apps
  labels:
    app: app-backend
spec:
  type: ClusterIP
  selector:
    app: app-backend
  ports:
    - name: http
      port: 80
      targetPort: 80
