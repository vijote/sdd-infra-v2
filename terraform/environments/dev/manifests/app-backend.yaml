# Application backend scaffold (006-app-backend) — sdd-apps namespace.
# Image is substituted by Terraform (012): empty backend_image_tag -> public baseline
# (nginx:alpine, no imagePullSecrets); non-empty -> ECR image + ecr-pull-secret.
# Each %%...%% placeholder appears exactly once (014 gotcha: replace() hits all occurrences).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-backend
  namespace: sdd-apps
  labels:
    app: app-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-backend
  template:
    metadata:
      labels:
        app: app-backend
    spec:
      containers:
        - name: app-backend
          image: %%BACKEND_IMAGE%%
          ports:
            - containerPort: %%BACKEND_PORT%%
              name: http
          readinessProbe:
            httpGet:
              path: %%BACKEND_READINESS_PATH%%
              port: %%BACKEND_PORT%%
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: %%BACKEND_LIVENESS_PATH%%
              port: %%BACKEND_PORT%%
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
%%BACKEND_PULL_SECRET%%
---
apiVersion: v1
kind: Service
metadata:
  name: app-backend
  namespace: sdd-apps
  labels:
    app: app-backend
spec:
  type: ClusterIP
  selector:
    app: app-backend
  ports:
    - name: http
      port: 80
      targetPort: %%BACKEND_PORT%%
