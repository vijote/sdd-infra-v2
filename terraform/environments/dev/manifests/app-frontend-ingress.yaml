# Application frontend Service + Ingress + Certificate (007-app-frontend-ingress) —
# sdd-apps namespace. Split (015-10): the frontend Deployment moved to app-frontend.yaml
# (count-gated on frontend_image_tag); this file is applied on EVERY terraform apply
# (always-applied null_resource) so fresh cluster recreations stay complete.
# %%INGRESS_HOST%% is replaced by Terraform (var.ingress_host) before base64.
# Each %%...%% placeholder appears exactly once (014 gotcha: replace() hits all occurrences).
---
apiVersion: v1
kind: Service
metadata:
  name: app-frontend
  namespace: sdd-apps
  labels:
    app: app-frontend
spec:
  type: ClusterIP
  selector:
    app: app-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: sdd-apps
  labels:
    app: app-frontend
  # 012-6: annotations belong in metadata (012-5 misplaced them under spec,
  # which K8s 1.28 strict decoding rejects). Regex capture $2 = everything
  # after /api. 015-12: these annotations apply to EVERY path and $2 requires
  # a SECOND capture group — /(.*) has only one ($2 undefined -> everything
  # rewrote to /), so the frontend rule is /()(.*): $1 = "", $2 = rest of
  # URL -> the rewrite is an identity (assets served as-is, unknown paths 404).
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - %%INGRESS_HOST%%
      secretName: demo-vijote-dev-tls
  rules:
    - host: %%INGRESS_HOST%%
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: app-backend
                port:
                  number: 80
          - path: /()(.*?)
            pathType: ImplementationSpecific
            backend:
              service:
                name: app-frontend
                port:
                  number: 80
---
# Let's Encrypt certificate (009-route53-domain) — issued by cert-manager via the
# letsencrypt-prod ClusterIssuer (HTTP-01 through the nginx ingress). Requires the
# Route 53 ALIAS record to be live so ACME can reach the challenge path.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-vijote-dev
  namespace: sdd-apps
spec:
  secretName: demo-vijote-dev-tls
  dnsNames:
    - %%INGRESS_HOST%%
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
