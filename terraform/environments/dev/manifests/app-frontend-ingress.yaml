# Application frontend + Ingress (007-app-frontend-ingress) — sdd-apps namespace.
# Public image (nginx:alpine) pulled via NAT egress — no imagePullSecrets.
# %%INGRESS_HOST%% is replaced by Terraform (var.ingress_host) before base64.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-frontend
  namespace: sdd-apps
  labels:
    app: app-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-frontend
  template:
    metadata:
      labels:
        app: app-frontend
    spec:
      containers:
        - name: app-frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-frontend
  namespace: sdd-apps
  labels:
    app: app-frontend
spec:
  type: ClusterIP
  selector:
    app: app-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: sdd-apps
  labels:
    app: app-frontend
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - %%INGRESS_HOST%%
      secretName: demo-vijote-dev-tls
  rules:
    - host: %%INGRESS_HOST%%
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: app-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-frontend
                port:
                  number: 80
---
# Let's Encrypt certificate (009-route53-domain) — issued by cert-manager via the
# letsencrypt-prod ClusterIssuer (HTTP-01 through the nginx ingress). Requires the
# Route 53 ALIAS record to be live so ACME can reach the challenge path.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-vijote-dev
  namespace: sdd-apps
spec:
  secretName: demo-vijote-dev-tls
  dnsNames:
    - %%INGRESS_HOST%%
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
