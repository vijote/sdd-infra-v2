# Application frontend + Ingress (007-app-frontend-ingress) — sdd-apps namespace.
# Public image (nginx:alpine) pulled via NAT egress — no imagePullSecrets.
# %%INGRESS_HOST%% is replaced by Terraform (var.ingress_host) before base64.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-frontend
  namespace: sdd-apps
  labels:
    app: app-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-frontend
  template:
    metadata:
      labels:
        app: app-frontend
    spec:
      containers:
        - name: app-frontend
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: app-frontend
  namespace: sdd-apps
  labels:
    app: app-frontend
spec:
  type: ClusterIP
  selector:
    app: app-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: sdd-apps
  labels:
    app: app-frontend
spec:
  ingressClassName: nginx
  rules:
    - host: %%INGRESS_HOST%%
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: app-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-frontend
                port:
                  number: 80
