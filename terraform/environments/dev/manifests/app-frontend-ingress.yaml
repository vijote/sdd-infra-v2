# Application frontend Service + Ingress + Certificate (007-app-frontend-ingress) —
# sdd-apps namespace. Split (015-10): the frontend Deployment moved to app-frontend.yaml
# (count-gated on frontend_image_tag); this file is applied on EVERY terraform apply
# (always-applied null_resource) so fresh cluster recreations stay complete.
# %%INGRESS_HOST%% is replaced by Terraform (var.ingress_host) before base64.
# Each %%...%% placeholder appears exactly once (014 gotcha: replace() hits all occurrences).
---
apiVersion: v1
kind: Service
metadata:
  name: app-frontend
  namespace: sdd-apps
  labels:
    app: app-frontend
spec:
  type: ClusterIP
  selector:
    app: app-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
---
# 015-13/015-14: annotations are PER-INGRESS, so the API (needs rewrite) and
# frontend (must NOT rewrite) rules can no longer share one object. Single-ingress
# regex attempts failed three ways: bare Prefix / (no groups -> $2 empty), /(.*)
# (one group -> $2 undefined), /()(.*?) (non-greedy -> $2 matches empty). Split:
# regex locations take precedence over prefix in nginx, so /api still wins.
# 015-14: the passthrough app-ingress is applied FIRST — the admission webhook
# rejects app-ingress-api while the stale pre-split app-ingress still claims the
# /api path for this host; replacing app-ingress first removes that conflict.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: sdd-apps
  labels:
    app: app-frontend
  # 015-13: NO rewrite annotations — frontend is a passthrough. Assets served
  # as-is with correct Content-Type; unknown paths 404 from the app.
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - %%INGRESS_HOST%%
      secretName: demo-vijote-dev-tls
  rules:
    - host: %%INGRESS_HOST%%
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress-api
  namespace: sdd-apps
  labels:
    app: app-backend
  # 012-6: annotations belong in metadata (012-5 misplaced them under spec,
  # which K8s 1.28 strict decoding rejects). Regex capture $2 = everything
  # after /api; rewrite-target /$2 strips the /api prefix.
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - %%INGRESS_HOST%%
      secretName: demo-vijote-dev-tls
  rules:
    - host: %%INGRESS_HOST%%
      http:
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: app-backend
                port:
                  number: 80
---
# Let's Encrypt certificate (009-route53-domain) — issued by cert-manager via the
# letsencrypt-prod ClusterIssuer (HTTP-01 through the nginx ingress). Requires the
# Route 53 ALIAS record to be live so ACME can reach the challenge path.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-vijote-dev
  namespace: sdd-apps
spec:
  secretName: demo-vijote-dev-tls
  dnsNames:
    - %%INGRESS_HOST%%
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
