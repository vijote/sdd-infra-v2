AWSTemplateFormatVersion: '2010-09-09'
Description: 'GitHub OIDC Roles for Terraform Deployment - Bootstrap and Assume Role Chaining'

Parameters:
  GitHubOrg:
    Type: String
    Description: GitHub organization name
    Default: vijote
  
  GitHubRepo:
    Type: String
    Description: GitHub repository name
    Default: sdd-infra-v2

Resources:
  # Bootstrap Role - Minimal permissions for role chaining
  BootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-bootstrap-role
      Description: Bootstrap role for GitHub Actions with minimal sts:AssumeRole permissions
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOrg}/${GitHubRepo}:*
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyName: BootstrapAssumeRolePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource: !GetAtt AssumeRole.Arn
      Tags:
        - Key: Purpose
          Value: GitHubActionsBootstrap
        - Key: ManagedBy
          Value: CloudFormation

  # Assume Role - Full infrastructure permissions for deployment
  AssumeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-assume-role
      Description: Assume role for GitHub Actions with full infrastructure deployment permissions
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt BootstrapRole.Arn
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:PrincipalArn: !GetAtt BootstrapRole.Arn
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: TerraformStateAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                  - dynamodb:*
                Resource:
                  - !Sub arn:aws:s3:::sdd-k8s-platform-terraform-state
                  - !Sub arn:aws:s3:::sdd-k8s-platform-terraform-state/*
                  - !Sub arn:aws:dynamodb:*:${AWS::AccountId}:table/sdd-k8s-platform-terraform-state-lock
      Tags:
        - Key: Purpose
          Value: GitHubActionsAssume
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  BootstrapRoleArn:
    Description: ARN of the bootstrap role for GitHub Actions
    Value: !GetAtt BootstrapRole.Arn
    Export:
      Name: GitHubActionsBootstrapRoleArn
  
  BootstrapRoleName:
    Description: Name of the bootstrap role
    Value: !Ref BootstrapRole
    Export:
      Name: GitHubActionsBootstrapRoleName
  
  AssumeRoleArn:
    Description: ARN of the assume role for GitHub Actions
    Value: !GetAtt AssumeRole.Arn
    Export:
      Name: GitHubActionsAssumeRoleArn
  
  AssumeRoleName:
    Description: Name of the assume role
    Value: !Ref AssumeRole
    Export:
      Name: GitHubActionsAssumeRoleName
  
  OIDCProvider:
    Description: OIDC provider ARN for GitHub Actions
    Value: !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
