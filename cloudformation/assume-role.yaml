AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub Actions Assume Role with Infrastructure Deployment Permissions

Parameters:
  BootstrapRoleArn:
    Type: String
    Description: ARN of the bootstrap role from the bootstrap stack

Resources:
  # Assume Role - Full infrastructure permissions for deployment
  AssumeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-assume-role
      Description: Assume role for GitHub Actions with full infrastructure deployment permissions
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref BootstrapRoleArn
            Action:
              - sts:AssumeRole
              - sts:TagSession
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: TerraformStateAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:*
                  - dynamodb:*
                Resource:
                  - !Sub arn:aws:s3:::sdd-k8s-platform-terraform-state
                  - !Sub arn:aws:s3:::sdd-k8s-platform-terraform-state/*
                  - !Sub arn:aws:dynamodb:*:${AWS::AccountId}:table/sdd-k8s-platform-terraform-state-lock
      Tags:
        - Key: Purpose
          Value: GitHubActionsAssume
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  AssumeRoleArn:
    Description: ARN of the assume role for GitHub Actions
    Value: !GetAtt AssumeRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-AssumeRoleArn
  AssumeRoleName:
    Description: Name of the assume role
    Value: !Ref AssumeRole
    Export:
      Name: !Sub ${AWS::StackName}-AssumeRoleName