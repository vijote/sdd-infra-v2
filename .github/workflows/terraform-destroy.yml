name: Terraform Destroy

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_BOOTSTRAP_ROLE_ARN: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
  AWS_TERRAFORM_ROLE: ${{ vars.AWS_TERRAFORM_ROLE }}
  TF_VAR_state_bucket_name: ${{ vars.AWS_STATE_BUCKET_NAME }}

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.5.0"

      - name: Configure AWS Bootstrap Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Assume Terraform Target Role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_TERRAFORM_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true

      - name: Confirm Destruction
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "destroy" ]; then
            echo "Confirmation failed. Expected 'destroy', got '${{ github.event.inputs.confirm }}'"
            exit 1
          fi

      - name: Terraform Init
        run: |
          cd terraform/environments/dev
          terraform init \
            -backend-config="bucket=${{ env.TF_VAR_state_bucket_name }}" \
            -backend-config="region=${{ env.AWS_REGION }}"
        env:
          TF_VAR_state_bucket_name: ${{ env.TF_VAR_state_bucket_name }}
          TF_VAR_region: ${{ env.AWS_REGION }}

      - name: Pre-Destroy ELB Cleanup
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag-key,Values=kubernetes.io/cluster/sdd-k8s-platform" \
            --query 'Vpcs[0].VpcId' --output text)
          if [ -z "$VPC_ID" ] || [ "$VPC_ID" = "None" ]; then
            exit 0
          fi
          LB_NAMES=$(aws elb describe-load-balancers \
            --query "LoadBalancerDescriptions[?VpcId=='${VPC_ID}'].LoadBalancerName" \
            --output text)
          if [ -z "$LB_NAMES" ] || [ "$LB_NAMES" = "None" ]; then
            exit 0
          fi
          for LB in $LB_NAMES; do
            aws elb delete-load-balancer --load-balancer-name "$LB"
            for i in $(seq 1 30); do
              EXISTS=$(aws elb describe-load-balancers --load-balancer-names "$LB" \
                --query 'LoadBalancerDescriptions[0].LoadBalancerName' --output text 2>/dev/null) || EXISTS=""
              if [ -z "$EXISTS" ] || [ "$EXISTS" = "None" ]; then
                break
              fi
              sleep 10
            done
          done

      - name: Terraform Destroy
        run: |
          cd terraform/environments/dev
          terraform destroy -auto-approve
        env:
          TF_VAR_state_bucket_name: ${{ env.TF_VAR_state_bucket_name }}
          TF_VAR_region: ${{ env.AWS_REGION }}
