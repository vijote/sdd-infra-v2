name: Terraform State Unlock

env:
  AWS_BOOTSTRAP_ROLE_ARN: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
  AWS_ASSUME_ROLE_ARN: ${{ vars.AWS_ASSUME_ROLE_ARN }}
  AWS_REGION: ${{ vars.AWS_REGION }}

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: 'Lock ID (empty to show all locks)'
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  unlock:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ">=1.5.0"

      - name: Configure AWS Credentials with Role Chaining
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-chaining: true
          role-duration-seconds: 3600
          role-external-id: ${{ env.AWS_ASSUME_ROLE_ARN }}

      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_region: ${{ env.AWS_REGION }}

      - name: Show Current Locks
        run: |
          echo "Checking for state locks..."
          aws s3api list-object-versions \
            --bucket sdd-k8s-platform-terraform-state \
            --prefix terraform.tfstate \
            --query 'Versions[?contains(Key, `.lock`)]' \
            --output table || echo "No lock files found"

      - name: Force Unlock State
        if: github.event.inputs.lock_id != ''
        run: |
          LOCK_ID="${{ github.event.inputs.lock_id }}"
          echo "Attempting to unlock state with ID: $LOCK_ID"
          terraform force-unlock "$LOCK_ID" -force